plugins { id 'com.android.application' }
android {
    namespace 'com.muslimtv.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.muslimtv.app'
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName '2.0'
    }
    androidResources { noCompress 'mp4', 'mp3' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { }
