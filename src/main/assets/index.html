.cl::before,.cl::after{content:"";position:absolute;background:#fff;border-radius:50%}

// ---- جدولة أذان ١٤ يوم قدّام وإرسالها للخدمة ----
function pushSched(){
 if(!window.MiskNative)return;
 try{
  const p=place(),now=Date.now(),k=M[S.m=='auto'?p.m:S.m];
  const dp=Object.fromEntries(fm(p.tz,{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now).map(x=>[x.type,+x.value]));
  const items=[];
  for(let o=0;o<14;o++){
   const t=new Date(Date.UTC(dp.year,dp.month-1,dp.day+o));
   const ram=fm(p.tz,{month:'numeric'},'en-u-ca-islamic-umalqura').format(t.getTime()+12*36e5)=='9';
   const a=calc(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate(),p.lat,p.lon,k,+S.asr,ram);
   [0,2,3,4,5].forEach(i=>{if(a[i]>now){const pi=i>1?i-1:i;items.push({t:a[i],v:S.pv[pi]>=0?S.pv[pi]:S.vo,n:NM[i]})}});
  }
  MiskNative.setSchedule(JSON.stringify({on:+S.on,items}));
 }catch(e){}
}
